name: Bug report
description: Something pi-ard did wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduce
      description: Registry URL, query, identifier, and the tool output. Remove anything private.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "pi-ard 0.1.0, pi 1.3.0, node 22.x, OS"
    validations:
      required: true
  - type: markdown
    attributes:
      value: "**Security issue?** Don't file it here. See SECURITY.md."
