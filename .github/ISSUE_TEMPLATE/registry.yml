name: Registry compatibility
description: An ARD registry or catalog that pi-ard doesn't handle
labels: [compat]
body:
  - type: input
    id: endpoint
    attributes:
      label: Search endpoint or domain
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Request and response sample
      description: curl command plus a trimmed response body.
      render: shell
    validations:
      required: true
